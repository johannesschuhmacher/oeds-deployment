- name: OEDS package installation
  hosts: oeds
  become: true
  vars:
    oeds_package_state: present
  tasks:
  - name: Install Docker packages
    ansible.builtin.dnf:
      name:
        - containerd.io
        - docker-ce
        - docker-ce-cli
        - docker-ce-rootless-extras
        - docker-buildx-plugin
        - docker-compose-plugin
      state: "{{ oeds_package_state }}"
  - name: Add the deployment user to the Docker operator group
    ansible.builtin.user:
      name: "{{ ansible_user }}"
      groups:
        - docker
      append: true
    when:
      - ansible_user is defined
      - ansible_user != "root"
