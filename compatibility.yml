name: oeds-deployment-compatibility
version: "0.0.0-rc.0-github"

components:
  oeds-core:
    path: "../../sources/oeds-core"
    repository: "https://github.com/open-energy-data-server/open-energy-data-server.git"
    branch: "main"
    commit: "6d6d228f00798be3652406620959ee99080c2768"

  oeds-kit-source:
    path: "../../.."
    repository: "https://github.com/johannesschuhmacher/open-energy-data-server-KIT.git"
    branch: "main"
    commit: "0e3ee0b8223750d9ebda3bac0793c0cbeaeb06ea"

  oeds-crawler-pack:
    path: "../oeds-crawler-pack"
    repository: "https://github.com/johannesschuhmacher/oeds-crawler-pack.git"
    branch: "main"
    commit: "494c01f45e7ef0d048e036f45999a006bc01b6d4"
    status: "github-initial"
    registry_priority: "before-oeds-core"

  oeds-scheduler-ui:
    path: "../oeds-scheduler-ui"
    repository: "https://github.com/johannesschuhmacher/oeds-scheduler-ui.git"
    branch: "main"
    commit: "9f5682856a6713852f71f70fd671b07672ca9d54"
    status: "github-initial"

  oeds-post-scripts:
    path: "../oeds-post-scripts"
    repository: "https://github.com/johannesschuhmacher/oeds-post-scripts.git"
    branch: "main"
    commit: "0fcc725750af4de20043840f25ea3a303c6c339d"
    status: "github-initial"
    commands:
      - "oeds-post gapfill smard"
      - "oeds-post gapfill entsoe-fms"
      - "oeds-post refresh entsoe-availability-map"
      - "oeds-post forecast day-ahead-price"
      - "oeds-post backfill entsoe-unavailability"
    migration:
      config_check: "oeds-post --migrate-config CRAWLER_CONFIG.yml --check"
      config_write_example: "oeds-post --migrate-config CRAWLER_CONFIG.yml --output CRAWLER_CONFIG.post.yml"

  oeds-deployment:
    path: "."
    repository: "https://github.com/johannesschuhmacher/oeds-deployment.git"
    branch: "main"
    self: true
    status: "github-initial"
    compose:
      baseline: "compose.yml"
      modular_overlay: "compose.modular.yml"
      test_overlay: "compose.test.yml"
    smoke_checks:
      - "python tools/verify_deployment.py"
      - "docker compose --profile crawlers -f compose.yml -f compose.modular.yml config"
      - "docker compose -f compose.yml -f compose.modular.yml -f compose.test.yml config"
      - "pwsh ./tools/test_db_smoke.ps1"
      - "pwsh ./tools/test_real_crawler_smoke.ps1 -RunPostScripts"
      - "pwsh ./tools/test_active_crawlers_smoke.ps1 -IncludeEntsoeFms"
      - "pwsh ./tools/test_stack_smoke.ps1"
      - "bash ./tools/oeds_clean_install_from_git.sh --help"
      - "bash ./tools/load_sample_data.sh --help"

compatibility:
  python: ">=3.12,<3.15"
  uv: ">=0.11.7,<0.12"
  postgres: ">=16,<19"

release_readiness:
  local_full_function_test: "../../docs/full-function-test-2026-06-02.md"
  publication_checklist: "../../docs/publication-readiness.md"
  publish_exclusions:
    - ".env"
    - ".env.*"
    - ".tmp/"
    - "runtime/"
    - "logs/"
    - "crawler_admin_state/"
    - "docker_data/"
